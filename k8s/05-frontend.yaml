apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: unireserve
  labels:
    app.kubernetes.io/name: unireserve-frontend
    app.kubernetes.io/part-of: unireserve-system
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: unireserve-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: unireserve
  labels:
    app.kubernetes.io/name: unireserve-frontend
    app.kubernetes.io/part-of: unireserve-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unireserve-frontend
  template:
    metadata:
      labels:
        app: unireserve-frontend
    spec:
      containers:
        - name: frontend
          image: juanma313/unireserve-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
