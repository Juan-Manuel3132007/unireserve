apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: unireserve
  labels:
    app.kubernetes.io/name: unireserve-db
    app.kubernetes.io/part-of: unireserve-system
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: unireserve-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unireserve-postgres
  namespace: unireserve
  labels:
    app.kubernetes.io/name: unireserve-db
    app.kubernetes.io/part-of: unireserve-system
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: unireserve-db
  template:
    metadata:
      labels:
        app: unireserve-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: unireserve-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unireserve-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: unireserve-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - unireserve
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - unireserve
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
        labels:
          app.kubernetes.io/name: unireserve-db
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
