# ---------------------------------------------------------------------------
# PLANTILLA DE SECRETOS — UniReserve
#
# Copiar este archivo a 02-secret.yaml y reemplazar los valores de ejemplo:
#   cp k8s/02-secret.example.yaml k8s/02-secret.yaml
#
# O generar los secretos automáticamente de forma segura con:
#   pwsh scripts/crear-secretos.ps1
#
# NOTA DE SEGURIDAD (Criterio D7):
# 02-secret.yaml NUNCA se versiona en Git (está en .gitignore).
# Solo se versiona esta plantilla con valores de ejemplo.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: unireserve-secrets
  namespace: unireserve
  labels:
    app.kubernetes.io/name: unireserve-secrets
    app.kubernetes.io/part-of: unireserve-system
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CAMBIAME_CONTRASENA_SEGURA"
  POSTGRES_DB: "unireserve"
  JWT_SECRET: "CAMBIAME_JWT_SECRET_HEX_64_CARACTERES"
  DATABASE_URL: "postgresql+psycopg://postgres:CAMBIAME_CONTRASENA_SEGURA@postgres-service:5432/unireserve"
