apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: unireserve
  labels:
    app.kubernetes.io/name: unireserve-backend
    app.kubernetes.io/part-of: unireserve-system
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: unireserve-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: unireserve
  labels:
    app.kubernetes.io/name: unireserve-backend
    app.kubernetes.io/part-of: unireserve-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unireserve-backend
  template:
    metadata:
      labels:
        app: unireserve-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: juanma313/unireserve-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: unireserve-backend-config
            - secretRef:
                name: unireserve-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
