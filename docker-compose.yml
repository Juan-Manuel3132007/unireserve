# ---------------------------------------------------------------------------
# UniReserve — orquestacion del monorepo
#
#   git clone --recurse-submodules https://github.com/Juan-Manuel3132007/unireserve.git
#   cd unireserve
#   docker compose up --build                  # construye desde los submodulos
#   docker compose pull && docker compose up   # o usa las imagenes de Docker Hub
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: unireserve-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-unireserve}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unireserve}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unireserve

  backend:
    image: ${DOCKERHUB_USER:-juanma313}/unireserve-backend:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unireserve-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # El host es "db": el nombre del servicio en la red de Compose, no localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-unireserve}
      JWT_SECRET: ${JWT_SECRET:-clave-local-de-desarrollo-no-usar-en-produccion}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "8000:8000"
    networks:
      - unireserve

  frontend:
    image: ${DOCKERHUB_USER:-juanma313}/unireserve-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El navegador resuelve esta URL desde FUERA de Docker: por eso es localhost.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: unireserve-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - unireserve

volumes:
  postgres_data:

networks:
  unireserve:
    driver: bridge