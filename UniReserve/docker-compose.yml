# ---------------------------------------------------------------------------
# UniReserve — entorno local completo con un solo comando:
#
#     docker compose up --build
#
# Levanta PostgreSQL, el backend (que aplica migraciones y seed al arrancar)
# y el frontend servido por Nginx.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: unireserve-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-unireserve}
    ports:
      # Se expone solo para poder inspeccionar la base con psql o DBeaver.
      # El backend NO usa este puerto: se conecta por la red interna.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unireserve}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unireserve

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unireserve-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # El host es "db": el nombre del servicio en la red de Compose, no localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-unireserve}
      JWT_SECRET: ${JWT_SECRET:-clave-local-de-desarrollo-no-usar-en-produccion}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "8000:8000"
    networks:
      - unireserve

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El navegador del usuario resuelve esta URL desde FUERA de Docker,
        # por eso apunta a localhost y no al nombre del servicio.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: unireserve-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - unireserve

volumes:
  postgres_data:
    driver: local

networks:
  unireserve:
    driver: bridge
